name: Update marketplace sales activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ebay-sales-feed.yml"
      - "tools/fetch-ebay-sales-feed.mjs"
      - "data/sales-backfill.json"

permissions:
  contents: write

concurrency:
  group: ebay-sales-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch eBay orders and publish anonymised feed
        run: node tools/fetch-ebay-sales-feed.mjs
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: EBAY_AU
          EBAY_API_DAYS_BACK: "90"
          EBAY_HISTORY_WINDOW_DAYS: "730"
          EBAY_PAGE_LIMIT: "100"
          EBAY_MAX_PAGES: "25"

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sales-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update marketplace sales activity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
